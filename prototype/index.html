<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Dungeon prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=IM+Fell+English&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" integrity="sha384-hs5SINUk7GPohxRis+rS7grpSWEbtOIJ3sRoseBKg3CDPIKpG55RfSenbvA6ALOt" crossorigin="anonymous">
<style>
:root{--bg:#f4f2ee;--card:#ffffff;--soft:#f0eee9;--tx:#1f1e1c;--tx2:#5f5e5a;--bd:#d9d6cf;--acc:#185fa5;--ok:#3b6d11;--bad:#a32d2d;--warn:#854f0b}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1d;--soft:#2a2926;--tx:#ecebe7;--tx2:#a9a7a0;--bd:#3a3935;--acc:#85b7eb;--ok:#97c459;--bad:#f09595;--warn:#fac775}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:16px}
.wrap{max-width:860px;margin:0 auto}
.note{font-size:12px;color:var(--tx2);margin:0 0 10px}
/* game style */
.g{background:#0d0b09;border-radius:12px;padding:18px;font-family:'Cinzel',serif;color:#c9b38a;min-height:420px}
.pan{background:#1a1612;border:2px solid #4a3d2c;outline:1px solid #2a2219;outline-offset:-6px;padding:14px 16px}
.tt{text-align:center;color:#d8b25a;font-size:17px;letter-spacing:2px;margin:0 0 12px}
.sm{font-size:11px;color:#8a7650}
.btn{font-family:'Cinzel',serif;background:#2a2219;color:#d8b25a;border:1px solid #6b5636;padding:8px 14px;cursor:pointer;letter-spacing:1px}
.btn:hover{border-color:#d8b25a}
.red{color:#e05a4a!important;border-color:#a8321f!important}
.it{background:#1a1612;border:2px solid #4a3d2c;padding:10px;cursor:pointer;text-align:center}
.it:hover{border-color:#6b5636}.on{border-color:#d8b25a!important}.fog{opacity:.5;cursor:default}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #2e261c;gap:8px}
.box{background:#0d0b09;border:1px solid #4a3d2c;min-width:44px;text-align:center;padding:2px 6px;color:#e8dcc0}
.fl{display:flex;gap:8px;font-size:12px;padding:4px 6px;cursor:pointer;border:1px solid transparent}
.fl:hover{border-color:#4a3d2c}.sel{border-color:#d8b25a!important;background:#241e16}
.zn{font-size:12px;color:#d8b25a;letter-spacing:1px;margin:10px 0 4px;display:flex;justify-content:space-between}
.orb{width:92px;height:92px;border-radius:50%;border:3px solid #4a3d2c;background:#120f0c;position:relative;overflow:hidden}
.liq{position:absolute;left:0;right:0;bottom:0;transition:height .8s}
.orbt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#f3e6c8}
.mn{display:block;width:220px;margin:8px auto;font-family:'Cinzel',serif;background:none;border:none;color:#c9b38a;font-size:15px;cursor:pointer;letter-spacing:2px}
.mn:hover{color:#d8b25a}
.inp{font-family:'Cinzel',serif;background:#0d0b09;border:1px solid #6b5636;color:#e8dcc0;padding:8px;width:100%}
.big{font-size:22px;letter-spacing:3px;margin:0 0 4px;text-align:center}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.scroll{background:#e9dcbc;border-top:8px solid #b89d6a;border-bottom:8px solid #b89d6a;border-radius:3px;padding:10px 12px}
.scroll textarea{width:100%;background:transparent;border:none;resize:vertical;font-family:'IM Fell English',Georgia,serif;font-size:15px;line-height:1.6;color:#2b2016;outline:none;padding:0}
.ink{font-size:11px;color:#6b5434;font-family:'Cinzel',Georgia,serif;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.tab{font-family:'Cinzel',Georgia,serif;background:#1a1612;color:#a8957a;border:1px solid #4a3d2c;padding:6px 12px;cursor:pointer;font-size:12px}
.ton{color:#d8b25a;border-color:#d8b25a}
.zsel{border:1px solid #d8b25a!important;background:#241e16}
.zn{cursor:pointer;padding:2px 6px;border:1px solid transparent}
/* work style */
.bar{background:#0d0b09;border-radius:10px 10px 0 0;padding:8px 12px;display:flex;align-items:center;gap:12px;font-family:'Cinzel',serif;color:#c9b38a;font-size:12px}
.bar a{color:#c9b38a;cursor:pointer}
.mo{width:18px;height:18px;border-radius:50%;border:1.5px solid #4a3d2c;position:relative;overflow:hidden;background:#120f0c}
.mo div{position:absolute;left:0;right:0;bottom:0}
.wk{background:var(--card);border:1px solid var(--bd);border-top:none;border-radius:0 0 12px 12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.split>div{padding:14px 16px}.split>div:first-child{border-right:1px solid var(--bd)}
.lb{font-size:12px;color:var(--tx2);margin:0}
.wb{font-family:inherit;font-size:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
.wb:hover{background:var(--soft)}
textarea{width:100%;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;resize:vertical}
.mono{font-family:ui-monospace,Menlo,monospace}
textarea:disabled{background:var(--soft);color:var(--tx2)}
.ex{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;white-space:pre;overflow-x:auto}
.ck{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
.op{display:block;width:100%;text-align:left;margin:6px 0}
.osel{border-color:var(--acc)!important}.ook{border-color:var(--ok)!important;color:var(--ok)}.ono{border-color:var(--bad)!important;color:var(--bad)}
table{border-collapse:collapse;font-size:12px}td{border:1px solid var(--bd);padding:4px 10px;text-align:center}
@media (max-width:640px){.g2,.split{grid-template-columns:1fr}.split>div:first-child{border-right:none;border-bottom:1px solid var(--bd)}}
</style>
</head>
<body>
<div class="wrap">
<p class="note">Interview Dungeon · clickable design prototype · Google SWE intern path · nothing here is real data</p>
<div id="app"></div>
</div>
<script>
const S={hero:{n:'Rookie',c:'Warrior',l:3,xp:240,coding:22,comm:10,story:35},ready:14.2,heroes:[],cls:0,floor:'III',boss:false,qi:0,qp:-1,qc:false,qr:[],lang:'en'};
S.heroes=[S.hero];
const CL=[['Warrior','ti-sword'],['Sorcerer','ti-wand'],['Rogue','ti-target'],['Barbarian','ti-axe']];
const Z=[
 ['The cathedral','Gates',[['I','Application and resume',5,'done','text'],['II','Coding foundations',10,'done','code']]],
 ['The catacombs','DSA basics',[['III','Arrays and strings',3.75,'now','code'],['IV','Hash maps and sets',3.75,'open','code'],['V','Two pointers, sliding window',3.75,'open','code'],['VI','Stacks and queues',3.75,'open','code'],['VII','Linked lists',3.75,'open','code'],['VIII','Binary search',3.75,'open','code']]],
 ['The caves','DSA advanced',[['IX','Recursion and backtracking',3.75,'open','code'],['X','Trees',3.75,'req IX','code'],['XI','Heaps',3.75,'req X','code'],['XII','Graphs',3.75,'req X','code'],['XIII','Intervals',3.75,'open','code'],['XIV','Dynamic programming',3.75,'req IX','code']]],
 ['The abyss','The interview itself',[['XV','Technical communication',20,'open','code'],['XVI','Online assessment',10,'open','code'],['XVII','Team match',10,'open','text'],['XVIII','The full loop',0,'boss','final']]]];
const FL={};Z.forEach(z=>z[2].forEach(f=>FL[f[0]]=f));
const app=document.getElementById('app');
S.hist=[];
function go(v,nb){if(!nb&&S.view&&S.view!==v)S.hist.push(S.view);S.view=v;render();window.scrollTo(0,0)}
function back(){if(['win','lose','lvl'].includes(S.view)){S.hist=['select','dungeons','char'];go('descent',true);return}let p=S.hist.pop();while(p&&['win','lose','lvl'].includes(p))p=S.hist.pop();if(S.view==='code'&&S.boss){S.boss=false;p='descent'}go(p||'title',true)}
function ic(c){return CL.find(x=>x[0]===c)[1]}
function bar(t){return `<div class="bar"><a onclick="back()" title="Back"><i class="ti ti-arrow-left"></i> Back</a><span style="flex:1">${t}</span><span id="tm">${S.boss?'<i class="ti ti-hourglass"></i> 45:00 left':'<i class="ti ti-clock"></i> 00:00'}</span><div class="mo" title="Readiness"><div style="height:${S.ready}%;background:#8e1b14"></div></div><div class="mo" title="Experience"><div style="height:${S.hero.xp/3}%;background:#1f3a8a"></div></div></div>`}
function steps(f){
 if(f[4]==='final')return [['Two 45 min interviews back to back','final']];
 if(f[0]==='XVII')return [['Learn: team match and STAR','learn'],['Tell me about yourself','text'],['Story: ambiguity','text'],['Story: collaboration','text'],['Story: learning fast','text'],['Story: stepping up','text'],['Project deep dive','text'],['Questions for the host','text'],['Boss: mock host call','boss']];
 if(f[0]==='I')return [['Write your resume draft','text'],['Checklist pass','text'],['Rewrite','text'],['Boss: resume passes, 5 min project talk','boss']];
 return [['Learn: the pattern','learn'],['Recognize (quiz)','quiz'],['Easy 1','code'],['Easy 2','code'],['Medium 1','code'],['Medium 2','code'],['Medium 3','code'],['Explain','text'],['Boss: unseen medium, 45 min','boss']];
}
const V={};
S.notes={gen:'Oct 6: read a chapter on tracer bullets. Side project: started issue #12. Class: algebra quiz on Friday.','z:The catacombs':'All of these floors are array or pointer tricks. Draw the indexes on paper first.','f:III':'Prefix totals: start the list with 0 to avoid the off by one.'};
S.ed={gen:'Oct 6','z:The catacombs':'Oct 2','f:III':'Oct 4'};S.sub='steps';S.dsel=null;
function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function scrollBox(k,label){return `<div class="scroll"><p class="ink"><span>${label}</span><span id="ed">${S.ed[k]?'last edit '+S.ed[k]:'empty'}</span></p><textarea id="ta" data-k="${k}" rows="6" placeholder="Write what you learned, or anything extra">${esc(S.notes[k]||'')}</textarea></div><p class="sm" style="margin:8px 0 0;font-family:system-ui">Notes are your diary. They don't change XP or readiness.</p>`}
function bindNote(){const a=document.getElementById('ta');if(!a)return;a.oninput=()=>{S.notes[a.dataset.k]=a.value;S.ed[a.dataset.k]='today';document.getElementById('ed').textContent='last edit today'}}

V.title=()=>`<div class="g" style="text-align:center;padding-top:70px"><p style="font-size:34px;color:#a8321f;letter-spacing:4px;margin:0">Interview</p><p style="font-size:24px;color:#d8b25a;letter-spacing:8px;margin:0 0 36px">Dungeon</p><button class="mn" onclick="go('select')">Enter</button><button class="mn" style="color:#5a4d3a;cursor:default">Settings</button></div>`;
V.select=()=>{const h=S.hero;return `<div class="g"><p class="tt">Select hero</p><div class="g2"><div class="pan">${S.heroes.map((x,k)=>`<div class="it ${x===h?'on':''}" style="text-align:left;margin-bottom:6px" onclick="S.hero=S.heroes[${k}];render()"><i class="ti ${ic(x.c)}" style="color:#d8b25a"></i> ${x.n}</div>`).join('')}<button class="btn" style="width:100%;margin-top:6px" onclick="go('cls')">New hero</button></div><div class="pan"><p style="margin:0;color:#e8dcc0;font-size:15px">${h.n}</p><p class="sm" style="margin:2px 0 10px">${h.c} · level ${h.l}</p><p class="sm" style="margin:0 0 4px">Active dungeons</p><p style="margin:0;font-size:12px">Google SWE intern · ${S.ready.toFixed(1)}%</p></div></div><div style="display:flex;justify-content:space-between;margin-top:14px"><span></span><button class="btn" onclick="go('dungeons')">Play</button></div></div>`};
V.cls=()=>`<div class="g"><p class="tt">Choose your class</p><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">${CL.map((c,k)=>`<div class="it ${k===S.cls?'on':''}" onclick="S.cls=${k};render()"><i class="ti ${c[1]}" style="font-size:26px;color:#d8b25a"></i><p style="margin:6px 0 0;font-size:12px;color:#e8dcc0">${c[0]}</p></div>`).join('')}</div><p class="sm" style="text-align:center;margin-top:16px;font-family:system-ui">Your class changes how your hero looks. It doesn't change your skills or paths.</p><div style="display:flex;justify-content:space-between;margin-top:14px"><span></span><button class="btn" onclick="go('name')">Next</button></div></div>`;
V.name=()=>`<div class="g"><p class="tt">Name your hero</p><div class="pan"><p class="sm" style="margin:0 0 6px"><i class="ti ${CL[S.cls][1]}"></i> ${CL[S.cls][0]}</p><input class="inp" id="nm" maxlength="20" placeholder="Your hero's name" oninput="document.getElementById('er').textContent=''"><p id="er" style="font-size:12px;color:#e05a4a;margin:6px 0 0;min-height:16px;font-family:system-ui"></p></div><div style="display:flex;justify-content:space-between;margin-top:12px"><span></span><button class="btn" onclick="mk()">Create hero</button></div></div>`;
function mk(){const v=document.getElementById('nm').value.trim();if(!v){document.getElementById('er').textContent='Enter a name first';return}const h={n:esc(v),c:CL[S.cls][0],l:1,xp:0,coding:0,comm:0,story:0};S.heroes.push(h);S.hero=h;go('dungeons')}
V.dungeons=()=>`<div class="g"><p class="tt">Choose your dungeons</p><p class="sm" style="text-align:center;margin:-6px 0 12px">${S.hero.n} · pick one or more</p><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><div class="it on"><p style="margin:0;color:#e8dcc0">Google</p><p class="sm" style="margin:2px 0 6px">SWE intern · 18 floors</p><p style="margin:0;font-size:20px;color:#e05a4a">${S.ready.toFixed(1)}%</p><p style="margin:6px 0 0;font-size:11px;color:#6b8f4e">active</p></div><div class="it fog"><p style="margin:0">Ramp</p><p class="sm" style="margin:2px 0 0">SWE intern</p><p style="margin:10px 0 0;font-size:12px;color:#5a4d3a">uncharted</p></div><div class="it fog"><p style="margin:0">Mercury</p><p class="sm" style="margin:2px 0 0">SWE intern</p><p style="margin:10px 0 0;font-size:12px;color:#5a4d3a">uncharted</p></div></div><div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn" onclick="go('select')">Hero select</button><button class="btn" onclick="go('char')">Descend</button></div></div>`;
V.char=()=>{const h=S.hero,r=S.ready,x=h.xp;return `<div class="g"><div class="g2"><div class="pan"><p class="tt">Character</p><div class="kv"><span>Name</span><span class="box">${h.n}</span></div><div class="kv"><span>Class</span><span class="box">${h.c}</span></div><div class="kv"><span>Level</span><span class="box">${h.l}</span></div><div class="kv"><span>Experience</span><span class="box">${x}</span></div><div class="kv"><span>Next level</span><span class="box">300</span></div><p class="sm" style="margin:12px 0 2px">Attributes</p><div class="kv"><span>Coding</span><span class="box">${h.coding}</span></div><div class="kv"><span>Communication</span><span class="box">${h.comm}</span></div><div class="kv"><span>Storytelling</span><span class="box">${h.story}</span></div><div class="kv" style="color:#5a4d3a"><span>System design</span><span class="box" style="color:#5a4d3a">sealed</span></div></div><div class="pan"><p class="tt">Active dungeons</p><div class="kv"><span>Google SWE intern</span><span style="color:#e05a4a">${r.toFixed(1)}%</span></div><div class="kv" style="color:#5a4d3a"><span>Ramp SWE intern</span><span>uncharted</span></div><p class="sm" style="margin:14px 0 4px">Next</p><p style="margin:0;font-size:13px">Floor ${S.floor} · ${FL[S.floor][1]}</p><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px"><button class="btn" onclick="go('descent')">The descent</button><button class="btn" onclick="go('dungeons')">Dungeons</button><button class="btn" onclick="go('select')">Hero select</button></div></div></div><div class="pan" style="margin-top:12px"><p class="tt">The dev scroll</p>${scrollBox('gen','General notes')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><div style="text-align:center"><div class="orb"><div class="liq" style="height:${r}%;background:#8e1b14"></div><div class="orbt">${r.toFixed(1)}%</div></div><p class="sm" style="margin:6px 0 0">Readiness · Google</p></div><p class="sm" style="max-width:240px;text-align:center">The red orb shows the dungeon you're in. The list shows every active dungeon.</p><div style="text-align:center"><div class="orb"><div class="liq" style="height:${x/3}%;background:#1f3a8a"></div><div class="orbt">${Math.round(x/3)}%</div></div><p class="sm" style="margin:6px 0 0">Experience</p></div></div></div>`};
function col(s){return s==='done'?'#6b8f4e':s==='now'?'#d8b25a':s==='boss'?'#a8321f':s.startsWith('req')?'#5a4d3a':'#a8957a'}
function lab(s){return s==='done'?'cleared':s==='now'?'here':s==='boss'?'final boss':s.startsWith('req')?'needs '+s.slice(4):''}
V.descent=()=>{const k=S.dsel||('f:'+S.floor);const isZ=k.startsWith('z:');const f=isZ?null:FL[k.slice(2)];const mk=n=>S.notes[n]?' <span class="sm">· notes</span>':'';
 const map=Z.map(z=>`<div class="zn ${k==='z:'+z[0]?'zsel':''}" onclick="S.dsel='z:${z[0]}';render()"><span>${z[0]}${mk('z:'+z[0])}</span><span class="sm">${z[1]} · ${z[2].reduce((a,x)=>a+x[2],0)}%</span></div>`+z[2].map(x=>`<div class="fl ${k==='f:'+x[0]?'sel':''}" style="color:${col(x[3])}" onclick="S.floor='${x[0]}';S.dsel='f:${x[0]}';render()"><span style="min-width:34px">${x[0]}</span><span style="flex:1">${x[1]}${mk('f:'+x[0])}</span><span style="font-size:11px">${lab(x[3])}</span></div>`).join('')).join('');
 let right;
 if(isZ){const z=Z.find(z=>'z:'+z[0]===k);right=`<p style="color:#d8b25a;font-size:15px;margin:0">${z[0]}</p><p class="sm" style="margin:2px 0 10px">${z[1]} · zone notes</p>`+scrollBox(k,z[0]+' notes')}
 else{const st=steps(f);right=`<p style="color:#d8b25a;font-size:15px;margin:0">Floor ${f[0]}</p><p style="font-size:13px;margin:2px 0 4px">${f[1]}</p><p class="sm" style="margin:0 0 10px">${f[3]==='boss'?'Adds no percent. Confirms it.':'Worth '+f[2]+'% of this path'}${f[3].startsWith('req')?' · boss sealed until floor '+f[3].slice(4)+' is cleared':''}</p><div style="display:flex;gap:6px;margin-bottom:10px"><button class="tab ${S.sub==='steps'?'ton':''}" onclick="S.sub='steps';render()">Steps</button><button class="tab ${S.sub==='notes'?'ton':''}" onclick="S.sub='notes';render()">Notes</button></div>`+(S.sub==='notes'?scrollBox(k,'Floor '+f[0]+' notes'):st.map((s,n)=>`<div class="kv" style="cursor:pointer;color:${s[1]==='boss'||s[1]==='final'?'#e05a4a':'#c9b38a'}" onclick="open_('${s[1]}',${n})"><span>${s[0]}</span><span style="font-size:11px">›</span></div>`).join('')+`<p class="sm" style="margin:10px 0 0;font-family:system-ui">Click a zone or a floor, then a step.</p>`)}
 return `<div class="g"><p class="tt" style="margin:0">The descent</p><p class="sm" style="text-align:center;margin:2px 0 12px">Google SWE intern · readiness <span style="color:#e05a4a">${S.ready.toFixed(1)}%</span> · <a style="color:#d8b25a;cursor:pointer" onclick="go('char')">character</a></p><div class="g2"><div class="pan">${map}</div><div class="pan">${right}</div></div></div>`};
function open_(t,k){S.boss=false;S.step=steps(FL[S.floor])[k][0];if(t==='boss'){go('bossintro');return}if(t==='final'){go('final');return}if(t==='quiz'){S.qi=0;S.qp=-1;S.qc=false;S.qr=[];go('quiz');return}go(t)}
V.learn=()=>{const L={en:{w:'When to use it',w1:'The problem asks about totals of ranges, or "everything except position i". Words to watch: range, from day a to day b, all other.',i:'The idea',i1:'Walk once from the left, writing down the running total. Walk once from the right, doing the same. Now any range, or "everything except i", is a quick combination of two numbers you already have.',t:'Template',tr:'Trace with counts = [4, 1, 3]',tp:'Common traps',tp1:['Off by one: decide if prefix[i] includes position i, and stick to it.','Empty ranges: prefix lists usually start with a 0.','Space: the two lists cost O(n) extra memory. Say it.'],nx:'I read it · Next: Recognize'},pt:{w:'Quando usar',w1:'O problema pede totais de intervalos, ou "tudo menos a posição i". Palavras para ficar de olho: intervalo, do dia a ao dia b, todos os outros.',i:'A ideia',i1:'Percorra uma vez da esquerda anotando o total acumulado. Percorra uma vez da direita fazendo o mesmo. Agora qualquer intervalo, ou "tudo menos i", é uma conta rápida com dois números que você já tem.',t:'Modelo de código',tr:'Rastreio com counts = [4, 1, 3]',tp:'Armadilhas comuns',tp1:['Erro de um: decida se prefix[i] inclui a posição i, e mantenha.','Intervalos vazios: listas de prefixo geralmente começam com 0.','Espaço: as duas listas custam O(n) de memória extra. Fale isso.'],nx:'Li tudo · Próximo: Reconhecer'}}[S.lang];
 return bar(`Floor ${S.floor} · ${FL[S.floor][1]} · Learn`)+`<div class="wk" style="padding:16px 22px;font-size:15px;line-height:1.7"><div style="display:flex;justify-content:flex-end;gap:6px"><button class="wb" style="${S.lang==='en'?'border-color:var(--acc)':''}" onclick="S.lang='en';render()">EN</button><button class="wb" style="${S.lang==='pt'?'border-color:var(--acc)':''}" onclick="S.lang='pt';render()">PT-BR</button></div><h3>${L.w}</h3><p>${L.w1}</p><h3>${L.i}</h3><p>${L.i1}</p><h3>${L.t}</h3><div class="ex mono">def other_totals(counts):
    n = len(counts)
    left = [0] * n
    right = [0] * n
    for i in range(1, n):
        left[i] = left[i-1] + counts[i-1]
    for i in range(n-2, -1, -1):
        right[i] = right[i+1] + counts[i+1]
    return [left[i] + right[i] for i in range(n)]</div><h3>${L.tr}</h3><table><tr><td>i</td><td>0</td><td>1</td><td>2</td></tr><tr><td>left</td><td>0</td><td>4</td><td>5</td></tr><tr><td>right</td><td>4</td><td>3</td><td>0</td></tr><tr><td>answer</td><td>4</td><td>7</td><td>5</td></tr></table><h3>${L.tp}</h3><ul>${L.tp1.map(x=>`<li>${x}</li>`).join('')}</ul><div style="text-align:right"><button class="wb" onclick="S.qi=0;S.qp=-1;S.qc=false;S.qr=[];go('quiz')">${L.nx}</button></div></div>`};
const Q=[{q:'You get daily package counts and many questions like "how many packages from day 3 to day 40?". Which pattern answers each question fastest?',o:['Sliding window','Prefix sums','Two pointers','Sort first'],a:1,w:'Build running totals once, then each range is one subtraction. Every question becomes O(1).'},{q:'What is the time complexity?',c:'def has_pair(nums, target):\n    seen = set()\n    for x in nums:\n        if target - x in seen:\n            return True\n        seen.add(x)\n    return False',o:['O(1)','O(log n)','O(n)','O(n²)'],a:2,w:'One loop over n items, set lookups are O(1) on average. Total O(n), space O(n).'},{q:'n ≤ 100,000. Which is the slowest complexity that still passes?',o:['O(n²)','O(n log n)','O(2ⁿ)','O(n³)'],a:1,w:'100,000² is 10 billion steps. 100,000 × log(100,000) is about 1.7 million. Aim for O(n log n).'}];
V.quiz=()=>{if(S.qi>=Q.length){return bar(`Floor ${S.floor} · Recognize`)+`<div class="wk" style="padding:20px"><p style="font-size:16px">Step cleared. Every question answered correctly.</p><button class="wb" onclick="go('code')">Next: Easy 1</button></div>`}
 const x=Q[S.qi];return bar(`Floor ${S.floor} · ${FL[S.floor][1]} · Recognize`)+`<div class="wk" style="padding:16px 20px"><p class="lb">Question ${S.qi+1} of ${Q.length} · wrong answers come back at the end</p><p style="font-size:15px;line-height:1.6">${x.q}</p>${x.c?`<div class="ex mono">${x.c}</div>`:''}${x.o.map((o,k)=>{let c='';if(S.qc){if(k===x.a)c='ook';else if(k===S.qp)c='ono'}else if(k===S.qp)c='osel';return `<button class="wb op ${c}" onclick="if(!S.qc){S.qp=${k};render()}">${o}</button>`}).join('')}<p id="er" style="font-size:13px;color:var(--bad);min-height:18px;margin:4px 0"></p>${S.qc?`<p style="font-size:14px;line-height:1.6"><b style="color:${S.qp===x.a?'var(--ok)':'var(--bad)'};font-weight:500">${S.qp===x.a?'Correct.':'Not quite. This one comes back at the end.'}</b> ${x.w}</p>`:''}<div style="text-align:right"><button class="wb" onclick="qgo()">${S.qc?'Next':'Check'}</button></div></div>`};
function qgo(){if(!S.qc){if(S.qp<0){document.getElementById('er').textContent='Pick an answer first';return}S.qc=true;render();return}const x=Q[S.qi];if(S.qp!==x.a)Q.push(x);S.qi++;S.qp=-1;S.qc=false;render()}
V.code=()=>{const b=S.boss;return bar(`Floor ${S.floor} · ${FL[S.floor][1]} · ${b?'Boss':S.step||'Medium 1'}`)+`<div class="wk split"><div style="font-size:14px;line-height:1.6"><h3 style="margin:0 0 8px">Other belts total</h3><p style="margin:0">A sorting hub has n belts. counts[i] is the packages belt i handled today. Return a list where position i holds the total of every belt except belt i. No subtraction.</p><div class="ex mono">counts = [4, 1, 3]
output = [4, 7, 5]</div><p class="lb">2 ≤ n ≤ 100,000 · 0 ≤ counts[i] ≤ 10,000</p><p class="lb" style="margin-top:12px"><i class="ti ti-flag"></i> This problem is unfair</p></div><div style="display:flex;flex-direction:column;gap:8px"><p class="lb">Approach ${b?'(required before coding)':'(optional)'}</p><textarea id="ap" rows="2" oninput="lock()" placeholder="Left totals, right totals, combine"></textarea><p class="lb">Python · plain editor, no autocomplete</p><textarea id="cd" class="mono" rows="9" spellcheck="false">def other_belts_total(counts):
    </textarea><p id="lk" class="lb" style="color:var(--warn)"></p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${b?'':'<button class="wb" onclick="out(\'<span style=color:var(--ok)>Sample 1 passed</span> · <span style=color:var(--bad)>Sample 2 failed</span>\')"><i class="ti ti-player-play"></i> Run samples</button>'}<button class="wb" onclick="sub()">Submit</button><span id="out" style="font-size:13px;color:var(--tx2)"></span></div>${b?'<p class="lb">Prototype: <a style="color:var(--acc);cursor:pointer" onclick="win()">simulate win</a> · <a style="color:var(--acc);cursor:pointer" onclick="go(\'lose\')">simulate defeat</a></p>':''}</div></div>`};
function lock(){if(!S.boss)return;const n=!document.getElementById('ap').value.trim();document.getElementById('cd').disabled=n;document.getElementById('lk').textContent=n?'Write your approach first. The editor unlocks after.':''}
function out(h){document.getElementById('out').innerHTML=h}
function sub(){const c=document.getElementById('cd').value.replace('def other_belts_total(counts):','').trim();if(!c){out('<span style="color:var(--bad)">Write a solution first</span>');return}if(S.boss){win();return}out('7 of 9 hidden tests passed · failed on counts = [0, 0]')}
V.text=()=>bar(`Floor ${S.floor} · ${FL[S.floor][1]} · ${S.step||'Text check'}`)+`<div class="wk split" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)"><div><p style="margin:0 0 4px;font-size:15px;font-weight:500">Tell me about a time you worked through a disagreement with a teammate.</p><p class="lb" style="margin-bottom:10px">Proves: collaboration</p><div style="display:flex;gap:6px;margin-bottom:8px"><button class="wb"><i class="ti ti-keyboard"></i> Type</button><button class="wb"><i class="ti ti-microphone"></i> Speak</button></div><textarea id="tx" rows="9" oninput="tchk()">We had two database designs on our team project. I made a diagram and a teammate had a PR. We talked about it and we used theirs.</textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="lb" id="wc"></span><button class="wb" onclick="tsub()">Submit for AI review</button></div><p id="msg" style="font-size:13px;min-height:18px"></p></div><div><p class="lb" style="margin-bottom:6px">Checklist · live</p><div id="cl"></div><p class="lb" style="margin:14px 0 6px">Checked by AI after submit</p><div class="ck"><i class="ti ti-sparkles"></i>Situation and task are clear</div><div class="ck"><i class="ti ti-sparkles"></i>Actions are specific steps</div><div class="ck"><i class="ti ti-sparkles"></i>Story fits the question asked</div></div></div>`;
function tchk(){const t=document.getElementById('tx').value,w=t.match(/\b[\w']+\b/g)||[],n=w.length,I=w.filter(x=>/^(i|i'm|i've|my|me)$/i.test(x)).length,We=w.filter(x=>/^(we|our|us)$/i.test(x)).length;const it=[[n>=150&&n<=300,'Length 150 to 300 words',n+' words'],[I>We,'More "I" than "we"',I+' I · '+We+' we'],[/\d|result|ended up|which meant/i.test(t),'Has a concrete result','missing'],[/learn|next time|would do|taught me|differently/i.test(t),'Ends with what you learned','missing']];document.getElementById('cl').innerHTML=it.map(x=>`<div class="ck"><i class="ti ${x[0]?'ti-circle-check':'ti-circle-dashed'}" style="color:${x[0]?'var(--ok)':'var(--warn)'}"></i><span style="flex:1">${x[1]}</span><span class="lb">${x[0]?'':x[2]}</span></div>`).join('');document.getElementById('wc').textContent=n+' words';document.getElementById('msg').textContent='';return it.every(x=>x[0])}
function tsub(){document.getElementById('msg').innerHTML=tchk()?'<span style="color:var(--ok)">Sent for AI review. In a boss, 2 follow-up questions come next.</span>':'<span style="color:var(--bad)">Fix the live checklist first. The AI only reviews a draft that passes it.</span>'}
V.bossintro=()=>`<div class="g" style="text-align:center"><p class="sm">Floor ${S.floor} · ${FL[S.floor][1]}</p><p class="big" style="color:#a8321f">The ${FL[S.floor][1].split(' ')[0]} guardian</p><p class="sm" style="margin-bottom:14px">awaits in the dark</p><div class="pan" style="max-width:440px;margin:0 auto;text-align:left"><div class="kv"><span>Challenge</span><span>One unseen medium</span></div><div class="kv"><span>Time</span><span>45 minutes</span></div><div class="kv"><span>Run code</span><span style="color:#a8321f">Sealed</span></div><div class="kv"><span>Before coding</span><span>Write your approach</span></div><div class="kv"><span>To win</span><span>Hidden tests and complexity</span></div></div><div style="margin-top:16px"><button class="btn red" onclick="S.boss=true;go('code')">Fight</button></div></div>`;
function win(){const h=S.hero;S.ready+=1.5;h.coding+=8;h.xp+=150;S.lvl=false;if(h.xp>=300){h.xp-=300;h.l++;S.lvl=true}if(FL[S.floor][3]==='now'){FL[S.floor][3]='done';const k=Object.keys(FL);const nx=k[k.indexOf(S.floor)+1];if(FL[nx]&&FL[nx][3]==='open')FL[nx][3]='now';S.floor=nx}go('win')}
V.win=()=>`<div class="g" style="text-align:center"><p class="big" style="color:#d8b25a;margin-top:20px">The guardian is slain</p><p class="sm" style="margin-bottom:14px">Floor cleared · ${new Date().toISOString().slice(0,10)}</p><div class="pan" style="max-width:440px;margin:0 auto;text-align:left"><div class="kv"><span>Experience</span><span style="color:#6b8fd8">+150</span></div><div class="kv"><span>Coding</span><span>+8</span></div><div class="kv"><span>Google SWE intern</span><span style="color:#e05a4a">+1.5%</span></div><div class="kv"><span>Ramp SWE intern</span><span style="color:#5a4d3a">uncharted</span></div></div><p class="sm" style="margin-top:12px">Your record now says: you know this pattern, as of today.</p><button class="btn" onclick="go(S.lvl?'lvl':'descent')">Continue</button></div>`;
V.lose=()=>{S.hero.xp+=30;if(S.hero.xp>=300){S.hero.xp-=300;S.hero.l++}return `<div class="g" style="text-align:center"><p class="big" style="color:#a8321f;margin-top:20px">You have fallen</p><p class="sm" style="margin-bottom:14px">The guardian still stands</p><div class="pan" style="max-width:440px;margin:0 auto;text-align:left"><p class="sm" style="margin:0 0 6px">What broke your solution</p><div class="mono" style="font-size:12px;background:#0d0b09;border:1px solid #2e261c;padding:8px;color:#e8dcc0">input: counts = [0, 0]<br>expected: [0, 0]<br>yours: index error</div><div class="kv" style="margin-top:8px"><span>Experience for the attempt</span><span style="color:#6b8fd8">+30</span></div><div class="kv"><span>Readiness</span><span>unchanged</span></div></div><p class="sm" style="margin-top:12px">Return to town: one practice problem before you face it again.</p><button class="btn" onclick="S.boss=false;S.step='Extra practice';go('code')">Go to practice</button></div>`};
V.final=()=>{const left=Object.values(FL).filter(f=>f[3]!=='done'&&f[3]!=='boss').length;return `<div class="g" style="text-align:center"><p class="sm">Floor XVIII</p><p class="big" style="color:#a8321f">The full loop</p><p class="sm" style="color:#d8b25a;margin-bottom:14px">${left>3?'You approach unprepared':'You are close'}</p><div class="pan" style="max-width:440px;margin:0 auto;text-align:left"><div class="kv"><span>Floors not cleared</span><span>${left} of 17</span></div><div class="kv"><span>Readiness</span><span style="color:#e05a4a">${S.ready.toFixed(1)}%</span></div></div><p class="sm" style="margin-top:12px">You can fight now. It will be logged as a practice run and won't seal the path.</p><button class="btn red" onclick="S.boss=true;S.step='The full loop';go('code')">Fight anyway</button></div>`};
V.lvl=()=>`<div class="g" style="text-align:center;padding-top:50px"><p class="sm">Your experience grows</p><p class="big" style="color:#d8b25a;font-size:32px">Level ${S.hero.l}</p><p class="sm" style="margin-bottom:14px">${S.hero.n} · ${S.hero.c}</p><div class="pan" style="max-width:420px;margin:0 auto;text-align:left"><p style="font-size:13px;margin:0 0 6px">No points to spend.</p><p style="font-size:12px;color:#a8957a;margin:0;font-family:system-ui;line-height:1.6">Your attributes only grow from challenges you pass. Your level shows how much work you've put in. Your readiness shows how close you are.</p></div><button class="btn" style="margin-top:14px" onclick="go('char')">Continue</button></div>`;
const WORK=['learn','quiz','code','text'];
function render(){S.dsel=S.view==='descent'?S.dsel:S.dsel;app.innerHTML=(S.view!=='title'&&!WORK.includes(S.view)?'<button class="btn" style="margin-bottom:8px" onclick="back()"><i class="ti ti-arrow-left"></i> Back</button>':'')+V[S.view]();if(S.view==='code')lock();bindNote();if(S.view==='text')tchk()}
